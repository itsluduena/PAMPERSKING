<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pamper's King — Carta Digital y Pedidos</title>
  <!-- Tipografías con personalidad de rotisería / comida rápida clásica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-paper: #fcf8f0;       /* Tono papel cálido de la carta original */
      --bg-card: #ffffff;
      --red-brand: #d62828;      /* Rojo vibrante de títulos */
      --red-dark: #a61b1b;
      --yellow-mark: #ffd60a;    /* Amarillo resaltador de la carta */
      --yellow-soft: #fff3b0;
      --ink-dark: #1f1a17;       /* Tinta oscura cálida */
      --ink-muted: #5c534c;
      --blue-table: #1d4ed8;     /* Detalle azul del encabezado de tabla original */
      --green-wa: #25d366;
      --green-wa-dark: #1da851;
      --border-ink: #2b2420;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-paper);
      /* Patrón sutil de mantel/papel de comida rápida */
      background-image: radial-gradient(#e6dec8 1px, transparent 1px);
      background-size: 18px 18px;
      color: var(--ink-dark);
      line-height: 1.45;
      padding-bottom: 100px;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    /* ================= ENCABEZADO ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 900;
      background-color: var(--red-brand);
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--ink-dark);
      box-shadow: 0 4px 0 rgba(31, 26, 23, 0.15);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background-color: var(--yellow-mark);
      border: 3px solid var(--ink-dark);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 3px 3px 0 var(--ink-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 2px 2px 0 var(--ink-dark);
    }

    .brand-title span {
      display: inline-block;
      background-color: var(--yellow-mark);
      color: var(--ink-dark);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 6px;
      border: 1.5px solid var(--ink-dark);
      margin-top: 2px;
    }

    /* Botón superior del carrito */
    .top-cart-btn {
      background-color: var(--yellow-mark);
      color: var(--ink-dark);
      border: 3px solid var(--ink-dark);
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0 var(--ink-dark);
      transition: transform 0.1s;
    }

    .top-cart-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink-dark);
    }

    .cart-badge {
      background-color: var(--red-brand);
      color: #fff;
      border-radius: 99px;
      padding: 1px 8px;
      font-size: 0.8rem;
      border: 1.5px solid var(--ink-dark);
    }

    /* ================= BARRA DE CATEGORÍAS ================= */
    .nav-wrapper {
      background-color: var(--yellow-mark);
      border-bottom: 3px solid var(--ink-dark);
      padding: 10px 14px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .nav-wrapper::-webkit-scrollbar {
      display: none;
    }

    .nav-list {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    .nav-pill {
      text-decoration: none;
      background-color: #fff;
      color: var(--ink-dark);
      border: 2px solid var(--ink-dark);
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0 var(--ink-dark);
      transition: all 0.15s;
    }

    .nav-pill:hover {
      background-color: var(--red-brand);
      color: #fff;
    }

    /* ================= CONTENEDOR PRINCIPAL ================= */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .menu-section {
      margin-bottom: 40px;
      scroll-margin-top: 90px;
    }

    .section-header {
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .section-title {
      font-size: 1.75rem;
      color: var(--red-brand);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: linear-gradient(transparent 55%, var(--yellow-mark) 55%);
      padding: 0 6px;
      display: inline-block;
    }

    .section-note {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* Grilla responsiva: 1 col en teléfono, 2 o 3 en computadora */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    /* ================= TARJETAS DE PRODUCTO ================= */
    .dish-card {
      background-color: var(--bg-card);
      border: 2.5px solid var(--ink-dark);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 4px 4px 0 var(--ink-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s;
    }

    .dish-card:hover {
      transform: translateY(-2px);
    }

    .dish-card.special-card {
      background-color: #fffdf5;
      border: 3px solid var(--red-brand);
      box-shadow: 5px 5px 0 var(--red-brand);
    }

    /* Estilo título resaltado en amarillo como en la carta física */
    .dish-title-highlight {
      display: inline-block;
      background-color: var(--yellow-mark);
      color: var(--ink-dark);
      font-weight: 800;
      font-size: 1.05rem;
      padding: 2px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--ink-dark);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .dish-card.special-card .dish-title-highlight {
      background-color: var(--red-brand);
      color: #fff;
    }

    .dish-desc {
      font-size: 0.88rem;
      color: var(--ink-muted);
      font-weight: 500;
      margin-bottom: 14px;
    }

    .dish-quote {
      display: block;
      margin-top: 6px;
      font-weight: 800;
      color: var(--red-brand);
      font-style: italic;
    }

    /* Opciones y botones de agregar */
    .variants-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 2px dashed #e2d9c8;
    }

    .variant-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-paper);
      border: 1.5px solid var(--ink-dark);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .variant-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .variant-action {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .variant-price {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--red-brand);
    }

    .add-btn {
      background-color: var(--yellow-mark);
      color: var(--ink-dark);
      border: 2px solid var(--ink-dark);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink-dark);
      transition: all 0.1s;
    }

    .add-btn:hover {
      background-color: var(--red-brand);
      color: #fff;
    }

    .add-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink-dark);
    }

    /* ================= BOTÓN FLOTANTE WHATSAPP (ESQUINA INFERIOR IZQUIERDA) ================= */
    .wa-float-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 950;
      background-color: var(--green-wa);
      color: #fff;
      text-decoration: none;
      border: 3px solid var(--ink-dark);
      border-radius: 99px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 4px 4px 0 var(--ink-dark);
      transition: transform 0.15s, background-color 0.15s;
    }

    .wa-float-left:hover {
      background-color: var(--green-wa-dark);
      transform: scale(1.03);
    }

    .wa-float-left svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ================= BARRA INFERIOR RESUMEN DE CARRITO (MÓVIL/PC) ================= */
    .bottom-cart-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 940;
      background-color: var(--red-brand);
      color: #fff;
      border: 3px solid var(--ink-dark);
      border-radius: 99px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: none; /* Se muestra cuando hay productos */
      align-items: center;
      gap: 10px;
      box-shadow: 4px 4px 0 var(--ink-dark);
    }

    .bottom-cart-bar.visible {
      display: flex;
    }

    /* ================= PANEL LATERAL DEL CARRITO (DRAWER) ================= */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 26, 23, 0.65);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
    }

    .cart-overlay.open {
      display: flex;
    }

    .cart-drawer {
      background-color: var(--bg-paper);
      width: 100%;
      max-width: 420px;
      height: 100%;
      border-left: 4px solid var(--ink-dark);
      display: flex;
      flex-direction: column;
      animation: slideIn 0.22s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .cart-header {
      background-color: var(--yellow-mark);
      padding: 16px;
      border-bottom: 3px solid var(--ink-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-size: 1.4rem;
      color: var(--ink-dark);
    }

    .close-cart {
      background: var(--red-brand);
      color: #fff;
      border: 2px solid var(--ink-dark);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .cart-item {
      background: #fff;
      border: 2px solid var(--ink-dark);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 2px 2px 0 var(--ink-dark);
    }

    .cart-item-info h4 {
      font-size: 0.92rem;
      font-weight: 800;
    }

    .cart-item-info span {
      font-size: 0.85rem;
      color: var(--red-brand);
      font-weight: 700;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid var(--ink-dark);
      background: var(--yellow-mark);
      font-weight: 800;
      cursor: pointer;
    }

    .qty-val {
      font-weight: 800;
      min-width: 20px;
      text-align: center;
    }

    .cart-footer {
      background: #fff;
      border-top: 3px solid var(--ink-dark);
      padding: 16px;
    }

    .customer-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .customer-fields input, .customer-fields select {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid var(--ink-dark);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      background-color: var(--bg-paper);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .checkout-wa-btn {
      width: 100%;
      background-color: var(--green-wa);
      color: #fff;
      border: 3px solid var(--ink-dark);
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 3px 3px 0 var(--ink-dark);
    }

    .checkout-wa-btn:hover {
      background-color: var(--green-wa-dark);
    }

    /* Notificación rápida al agregar */
    .toast {
      position: fixed;
      top: 82px;
      right: 20px;
      background-color: var(--ink-dark);
      color: var(--yellow-mark);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .brand-title h1 { font-size: 1.2rem; }
      .wa-float-left span { display: none; } /* En móvil compacto deja solo el ícono de WA */
      .wa-float-left { padding: 12px; }
    }
  </style>
</head>

    let cart = [];

    function formatMoney(num) {
      return "$" + num.toLocaleString("es-AR");
    }

    // Renderizar la carta en pantalla
    function renderMenu() {
      const container = document.getElementById("menu-container");
      container.innerHTML = menuData.map(section => `
        <section class="menu-section" id="${section.id}">
          <div class="section-header">
            <h2 class="section-title">${section.title}</h2>
            <span class="section-note">${section.note}</span>
          </div>
          <div class="items-grid">
            ${section.items.map(item => `
              <article class="dish-card ${item.special ? 'special-card' : ''}">
                <div>
                  <span class="dish-title-highlight">${item.name}</span>
                  <p class="dish-desc">
                    ${item.desc}
                    ${item.quote ? `<span class="dish-quote">${item.quote}</span>` : ''}
                  </p>
                </div>
                <div class="variants-list">
                  ${item.variants.map(v => {
                    const fullTitle = item.variants.length > 1 ? `${item.name} (${v.label})` : item.name;
                    const safeTitle = fullTitle.replace(/'/g, "\\'");
                    return `
                      <div class="variant-row">
                        <span class="variant-label">${v.label}</span>
                        <div class="variant-action">
                          <span class="variant-price">${formatMoney(v.price)}</span>
                          <button class="add-btn" onclick="addToCart('${safeTitle}', ${v.price})">+ Pedir</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    // Agregar producto al carrito
    function addToCart(name, price) {
      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      updateCartUI();
      showToast(`+1 ${name}`);
    }

    // Cambiar cantidad
    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    // Actualizar interfaz del carrito
    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      document.getElementById("top-cart-count").textContent = totalItems;
      document.getElementById("bottom-cart-count").textContent = totalItems;
      document.getElementById("bottom-cart-total").textContent = formatMoney(totalPrice);
      document.getElementById("cart-total-price").textContent = formatMoney(totalPrice);

      const bottomBar = document.getElementById("bottom-cart-bar");
      if (totalItems > 0) {
        bottomBar.classList.add("visible");
      } else {
        bottomBar.classList.remove("visible");
      }

      const itemsContainer = document.getElementById("cart-items-container");
      const footer = document.getElementById("cart-footer");

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<div class="empty-cart-msg">Tu pedido está vacío.<br>¡Elegí lo que más te guste de la carta! 🍔🍕</div>`;
        footer.style.display = "none";
      } else {
        footer.style.display = "block";
        itemsContainer.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <span>${formatMoney(item.price * item.qty)}</span>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    // Enviar pedido armado a WhatsApp
    function sendOrderToWhatsApp() {
      if (cart.length === 0) return;

      const custName = document.getElementById("cust-name").value.trim();
      const deliveryType = document.getElementById("cust-delivery").value;
      const address = document.getElementById("cust-address").value.trim();

      let message = `¡Hola *Pamper's King*! Quiero hacer el siguiente pedido:\n\n`;

      cart.forEach(item => {
        message += `▪️ ${item.qty}x ${item.name} — ${formatMoney(item.price * item.qty)}\n`;
      });

      const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      message += `\n*TOTAL ESTIMADO: ${formatMoney(totalPrice)}*\n`;
      message += `🛵 *Modalidad:* ${deliveryType}\n`;
      if (custName) message += `👤 *Nombre:* ${custName}\n`;
      if (address) message += `📍 *Dirección / Notas:* ${address}\n`;

      const encodedMsg = encodeURIComponent(message);
      const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMsg}`;
      window.open(waUrl, "_blank");
    }

    function toggleCart() {
      document.getElementById("cart-overlay").classList.toggle("open");
    }

    function closeCartOnBg(e) {
      if (e.target.id === "cart-overlay") {
        toggleCart();
      }
    }

    let toastTimeout;
    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    // Inicializar
    renderMenu();
    updateCartUI();
  </script>
